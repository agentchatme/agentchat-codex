name: publish

# OIDC trusted publishing for @agentchatme/codex, gated by a human approval.
#
# ONE-TIME npm setup BEFORE the first tag from THIS repo: the package's
# Trusted Publisher must point at agentchatme/agentchat-codex, workflow
# publish.yml (bare filename), environment npm-publish. The package was
# previously published from agentchat-coding-agents, so this pairing has to be
# REPOINTED, not created — npm validates it only at publish time (a mismatch
# surfaces as E404 on PUT).
#
# Release flow: bump package.json → tag `v<version>` → push → approve.

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile now that the engine is a published, pinned version
      # rather than a filesystem link to a checkout of its moving main branch.
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
      - name: tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── What actually goes in the tarball ──
      #
      # @agentchatme/codex@0.0.11 shipped BROKEN from a fully green pipeline:
      # every user got "The AgentChat engine is missing from this install".
      # The gate had run `test -f <engine>` and passed — then `npm publish` ran
      # `prepublishOnly`, which re-ran a `clean: true` bundler and deleted the
      # very file that had just been verified.
      #
      # So: build the REAL tarball, unpack it somewhere empty, and run what came
      # out. No dry-run report, no JSON parsing — earlier versions of this guard
      # tried to read `npm pack --json` and blocked two good releases because
      # prepack scripts write to the same stdout, and npm's output shape differs
      # between the runner's npm and a contributor's. Untarring cannot drift.
      - name: the published tarball contains both bundles, and they run
        run: |
          set -euo pipefail
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          # --ignore-scripts: dist was just built by the step above, and letting
          # prepack rebuild is exactly what destroyed 0.0.11's tarball.
          tgz="$(npm pack --ignore-scripts --pack-destination /tmp/verify | tail -1)"
          echo "packed: $tgz"
          tar xzf "/tmp/verify/$tgz" -C /tmp/verify
          echo "--- tarball contents ---"
          (cd /tmp/verify/package && find . -type f | sed 's|^\./|  |' | sort)

          for f in dist/index.js dist/daemon-main.js; do
            if [ ! -f "/tmp/verify/package/$f" ]; then
              echo "::error::the tarball is missing $f"; exit 1
            fi
          done

          # Run them from the unpacked tarball with no node_modules beside it —
          # exactly how npx will. A missing inlined dependency dies here.
          mkdir -p /tmp/verify/empty-home
          cd /tmp/verify/package

          cli_out="$(node dist/index.js --version 2>&1 || true)"
          echo "--- cli --version: $cli_out"
          case "$cli_out" in
            *"Cannot find module"*|*"ERR_MODULE_NOT_FOUND"*|*"Dynamic require"*)
              echo "::error::the CLI is not self-contained"; exit 1;;
          esac
          [ "$cli_out" = "$(node -p "require('/tmp/verify/package/package.json').version")" ] || {
            echo "::error::--version printed '$cli_out', which is not the published version"; exit 1; }

          daemon_out="$(node dist/daemon-main.js --home /tmp/verify/empty-home 2>&1 || true)"
          echo "--- daemon: $daemon_out"
          case "$daemon_out" in
            *"no AgentChat identity"*) echo "both bundles start from the tarball" ;;
            *) echo "::error::the daemon did not start from the tarball"; exit 1;;
          esac

          # ── And through a bin shim, which is how npx actually runs it ──
          #
          # 0.0.12 shipped with `daemon install` broken for every user: the
          # daemon was resolved relative to process.argv[1], which under npx is
          # the symlink in node_modules/.bin, not the bundle. Running the files
          # by their real paths — as everything above does — cannot see that.
          # So install the tarball for real and drive the published bin.
          rm -rf /tmp/npxlike && mkdir -p /tmp/npxlike/home/.codex/agentchat
          cd /tmp/npxlike
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "/tmp/verify/$tgz" >/dev/null 2>&1
          printf '{"api_key":"ac_live_%040d","handle":"ci-probe"}' 0 \
            > /tmp/npxlike/home/.codex/agentchat/credentials
          shim_out="$(HOME=/tmp/npxlike/home CODEX_HOME=/tmp/npxlike/home/.codex \
            AGENTCHAT_SERVICE_DRY_RUN=1 ./node_modules/.bin/agentchat-codex daemon install 2>&1 || true)"
          echo "--- via node_modules/.bin: $shim_out"
          case "$shim_out" in
            *"daemon bundle is missing"*)
              echo "::error::daemon install cannot find the daemon when run through a bin shim"; exit 1;;
          esac
          test -f /tmp/npxlike/home/.codex/agentchat/bin/agentchat-daemon.mjs || {
            echo "::error::daemon install did not place the durable daemon copy"; exit 1; }
          echo "daemon install works through the published bin ✓"
          cd "$GITHUB_WORKSPACE"

      - run: npm publish --provenance --access public
