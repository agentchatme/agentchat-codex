name: publish

# OIDC trusted publishing for @agentchatme/codex, gated by a human approval.
#
# ONE-TIME npm setup BEFORE the first tag from THIS repo: the package's
# Trusted Publisher must point at agentchatme/agentchat-codex, workflow
# publish.yml (bare filename), environment npm-publish. The package was
# previously published from agentchat-coding-agents, so this pairing has to be
# REPOINTED, not created — npm validates it only at publish time (a mismatch
# surfaces as E404 on PUT).
#
# Release flow: bump package.json → tag `v<version>` → push → approve.

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile now that the engine is a published, pinned version
      # rather than a filesystem link to a checkout of its moving main branch.
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
      - name: tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── What actually goes in the tarball ──
      #
      # @agentchatme/codex@0.0.11 shipped BROKEN from a fully green pipeline:
      # every user got "The AgentChat engine is missing from this install".
      # The gate had run `test -f <engine>` and passed — then `npm publish` ran
      # `prepublishOnly`, which re-ran a `clean: true` bundler and deleted the
      # very file that had just been verified.
      #
      # So: build the REAL tarball, unpack it somewhere empty, and run what came
      # out. No dry-run report, no JSON parsing — earlier versions of this guard
      # tried to read `npm pack --json` and blocked two good releases because
      # prepack scripts write to the same stdout, and npm's output shape differs
      # between the runner's npm and a contributor's. Untarring cannot drift.
      - name: the published tarball contains both bundles, and the integration installs from it
        id: pack
        # scripts/release-smoke.sh: also run by ci.yml on every PR, so it cannot
        # go stale between releases (it did once and failed the 0.1.0 publish).
        run: bash scripts/release-smoke.sh

      - run: npm publish "${{ steps.pack.outputs.tgz }}" --ignore-scripts --provenance --access public
