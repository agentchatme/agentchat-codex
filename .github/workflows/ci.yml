name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # --frozen-lockfile now that the engine is a published, pinned version
      # rather than a filesystem link to a checkout of its moving main branch.
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test

      # The daemon must actually run, with no node_modules beside it — which is
      # how npx runs it. Its predecessor was wired to a command that did not
      # exist and restart-looped in production behind a green pipeline, because
      # the only check on it was that a file existed.
      - name: the daemon entry starts
        run: |
          home="$(mktemp -d)"
          out="$(cd "$(mktemp -d)" && node "$GITHUB_WORKSPACE/dist/daemon-main.js" --home "$home" 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"no AgentChat identity"*) echo "daemon reached identity resolution ✓" ;;
            *) echo "::error::the daemon did not start: $out"; exit 1 ;;
          esac
